<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>Surfer-Werkzeugleiste</title>
    <link rel="stylesheet" href="toolbar.css">
</head>
<body>
<div class="bar">
    <span class="status" id="status" title="Status"></span>
    <span class="name" id="name"></span>
    <div class="group">
        <button data-action="back" id="back" title="Zurück">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button data-action="reload" title="Neu laden">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button data-action="home" title="Zur Start-Adresse">
            <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
        </button>
    </div>
    <div class="url" id="url" title=""></div>
    <span class="chip" id="blocked" title="Blockierte Anfragen"></span>
    <div class="group">
        <button data-action="zoom-out" title="Verkleinern">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
        <button data-action="zoom-reset" class="zoom" id="zoom" title="Zoom zurücksetzen">100 %</button>
        <button data-action="zoom-in" title="Vergrößern">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>
    <div class="group">
        <button data-action="mute" id="mute" title="Ton an/aus">
            <svg viewBox="0 0 24 24" class="icon-muted"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
            <svg viewBox="0 0 24 24" class="icon-sound"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
        </button>
        <button data-action="hide" title="Fenster verbergen (Surfer läuft weiter)">
            <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg>
        </button>
        <button data-action="control" title="Hauptfenster öffnen">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 9v11"/></svg>
        </button>
    </div>
</div>
<script src="toolbar.js"></script>
</body>
</html>
