<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Surfer</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Texts are filled from the dictionary: data-i18n (text), data-i18n-title, data-i18n-placeholder -->
<body>
<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 16c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M6 12c1-5 5-8 10-8-2 2-3 4-3 8"/></svg>
        </div>
        <div>
            <div class="brand-name">Surfer</div>
            <div class="brand-version" id="app-version"></div>
        </div>
    </div>
    <nav class="nav" id="nav">
        <button class="nav-item active" data-view="surfers">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
            <span data-i18n="ui.nav.surfers"></span><span class="nav-badge" id="nav-surfers"></span>
        </button>
        <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
            <span data-i18n="ui.nav.settings"></span>
        </button>
        <button class="nav-item" data-view="lists">
            <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>
            <span data-i18n="ui.nav.lists"></span>
        </button>
        <button class="nav-item" data-view="system">
            <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
            <span data-i18n="ui.nav.system"></span>
        </button>
        <button class="nav-item" data-view="log">
            <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
            <span data-i18n="ui.nav.log"></span><span class="nav-badge warn" id="nav-log"></span>
        </button>
        <button class="nav-item" data-view="info">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
            <span data-i18n="ui.nav.info"></span>
        </button>
    </nav>
    <div class="sidebar-stats">
        <div class="meter">
            <div class="meter-label"><span>CPU</span><span id="side-cpu">–</span></div>
            <div class="meter-track"><div class="meter-fill" id="side-cpu-bar"></div></div>
        </div>
        <div class="meter">
            <div class="meter-label"><span>RAM</span><span id="side-ram">–</span></div>
            <div class="meter-track"><div class="meter-fill" id="side-ram-bar"></div></div>
        </div>
    </div>
</aside>

<main class="main">
    <div class="banner" id="restart-banner" hidden>
        <span data-i18n="ui.restartBanner"></span>
        <button class="btn btn-small" data-call="restartApp" data-i18n="ui.restartNow"></button>
    </div>

    <div class="banner info" id="update-banner" hidden>
        <span id="update-banner-text"></span>
        <button class="btn btn-small" id="update-banner-open" data-i18n="ui.upd.view"></button>
    </div>

    <!-- ========================= SURFERS ========================= -->
    <section class="view active" id="view-surfers">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.surfers.title"></h1>
                <p class="subtitle" id="surfers-summary"></p>
            </div>
            <div class="toolbar">
                <button class="btn" data-call="startAll" data-i18n-title="ui.btn.startAll.tip">
                    <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span data-i18n="ui.btn.startAll"></span>
                </button>
                <button class="btn" data-call="stopAll" data-i18n-title="ui.btn.stopAll.tip">
                    <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg><span data-i18n="ui.btn.stopAll"></span>
                </button>
                <button class="btn" data-call="reloadAll" data-i18n-title="ui.btn.reloadAll.tip">
                    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-i18n="ui.btn.reloadAll"></span>
                </button>
                <button class="btn" data-call="tile" data-i18n-title="ui.btn.tile.tip">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg><span data-i18n="ui.btn.tile"></span>
                </button>
                <button class="btn" data-call="showAll" data-i18n-title="ui.btn.showAll.tip">
                    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="ui.btn.showAll"></span>
                </button>
                <button class="btn" data-call="hideAll" data-i18n-title="ui.btn.hideAll.tip">
                    <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><path d="M4 4l16 16"/></svg><span data-i18n="ui.btn.hideAll"></span>
                </button>
            </div>
        </header>

        <form class="card add-form" id="add-form" autocomplete="off">
            <div class="field grow">
                <label for="add-url" data-i18n="ui.add.url"></label>
                <input id="add-url" type="text" data-i18n-placeholder="ui.add.urlPh" maxlength="2048" required>
            </div>
            <div class="field">
                <label for="add-name" data-i18n="ui.add.name"></label>
                <input id="add-name" type="text" data-i18n-placeholder="ui.add.namePh" maxlength="60">
            </div>
            <label class="check">
                <input id="add-start" type="checkbox" checked>
                <span data-i18n="ui.add.start"></span>
            </label>
            <button class="btn btn-primary" type="submit">
                <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="ui.add.submit"></span>
            </button>
        </form>

        <div class="surfer-list" id="surfer-list"></div>
        <div class="empty" id="surfers-empty" hidden>
            <svg viewBox="0 0 24 24"><path d="M2 16c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></svg>
            <h2 data-i18n="ui.empty.title"></h2>
            <p data-i18n="ui.empty.text"></p>
        </div>
    </section>

    <!-- ========================= SETTINGS ========================= -->
    <section class="view" id="view-settings">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.settings.title"></h1>
                <p class="subtitle" data-i18n="ui.settings.subtitle"></p>
            </div>
            <div class="toolbar">
                <button class="btn btn-danger-ghost" id="reset-settings" data-i18n="ui.settings.resetAll"></button>
            </div>
        </header>
        <div class="settings-grid" id="settings-groups"></div>
    </section>

    <!-- ========================= LISTS ========================= -->
    <section class="view" id="view-lists">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.lists.title"></h1>
                <p class="subtitle" data-i18n="ui.lists.subtitle"></p>
            </div>
        </header>
        <div class="lists-grid" id="lists"></div>
        <div class="card ua-card">
            <div class="card-head">
                <h2 data-i18n="ui.ua.title"></h2>
                <label class="switch" data-i18n-title="ui.ua.useTip">
                    <input type="checkbox" id="ua-enabled">
                    <span class="switch-track"></span>
                    <span class="switch-label" data-i18n="ui.ua.use"></span>
                </label>
            </div>
            <p class="hint" data-i18n="ui.ua.hint"></p>
            <input type="text" id="ua-input" maxlength="512" spellcheck="false">
            <div class="row-end">
                <button class="btn btn-ghost" id="ua-default" data-i18n="ui.ua.default"></button>
                <button class="btn btn-primary" id="ua-save" data-i18n="ui.save"></button>
            </div>
        </div>
    </section>

    <!-- ========================= SYSTEM ========================= -->
    <section class="view" id="view-system">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.sys.title"></h1>
                <p class="subtitle" id="overload-status"></p>
            </div>
        </header>
        <div class="tiles">
            <div class="tile"><div class="tile-label" data-i18n="ui.sys.cpu"></div><div class="tile-value" id="t-cpu">–</div></div>
            <div class="tile"><div class="tile-label" data-i18n="ui.sys.ram"></div><div class="tile-value" id="t-ram">–</div><div class="tile-sub" id="t-ram-sub"></div></div>
            <div class="tile"><div class="tile-label" data-i18n="ui.sys.app"></div><div class="tile-value" id="t-app">–</div><div class="tile-sub" id="t-app-sub"></div></div>
            <div class="tile"><div class="tile-label" data-i18n="ui.sys.blocked"></div><div class="tile-value" id="t-blocked">–</div></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h2 data-i18n="ui.sys.history"></h2>
                <div class="legend"><span class="legend-cpu">CPU</span><span class="legend-ram">RAM</span></div>
            </div>
            <canvas id="chart" height="180"></canvas>
        </div>
        <div class="card">
            <div class="card-head"><h2 data-i18n="ui.sys.processes"></h2></div>
            <div class="table-wrap">
                <table class="table">
                    <thead><tr>
                        <th data-i18n="ui.sys.pid"></th><th data-i18n="ui.sys.type"></th><th data-i18n="ui.sys.surfer"></th>
                        <th class="num">CPU</th><th class="num">RAM</th>
                    </tr></thead>
                    <tbody id="proc-body"></tbody>
                </table>
            </div>
        </div>
        <div class="card">
            <div class="card-head"><h2 data-i18n="ui.sys.tools"></h2></div>
            <div class="tools">
                <button class="btn" id="clear-shared" data-i18n="ui.sys.clearShared"></button>
                <button class="btn btn-ghost" data-folder="config" data-i18n="ui.sys.openConfig"></button>
                <button class="btn btn-ghost" data-folder="logs" data-i18n="ui.sys.openLogs"></button>
                <button class="btn btn-ghost" data-folder="data" data-i18n="ui.sys.openData"></button>
            </div>
        </div>
    </section>

    <!-- ========================= LOG ========================= -->
    <section class="view view-fill" id="view-log">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.log.title"></h1>
                <p class="subtitle" id="log-count"></p>
            </div>
            <div class="toolbar">
                <button class="btn btn-ghost" id="log-export" data-i18n="ui.log.export"></button>
                <button class="btn btn-ghost" id="log-clear" data-i18n="ui.log.clear"></button>
            </div>
        </header>
        <div class="log-filters">
            <div class="chips" id="log-levels">
                <button class="chip-toggle active" data-level="info" data-i18n="ui.log.filter.info"></button>
                <button class="chip-toggle active" data-level="warn" data-i18n="ui.log.filter.warn"></button>
                <button class="chip-toggle active" data-level="error" data-i18n="ui.log.filter.error"></button>
                <button class="chip-toggle active" data-level="block" data-i18n="ui.log.filter.block"></button>
                <button class="chip-toggle" data-level="debug" data-i18n="ui.log.filter.debug"></button>
            </div>
            <input type="search" id="log-search" data-i18n-placeholder="ui.log.search">
            <label class="check"><input type="checkbox" id="log-follow" checked><span data-i18n="ui.log.follow"></span></label>
        </div>
        <div class="log" id="log" role="log"></div>
    </section>

    <!-- ========================= INFO ========================= -->
    <section class="view" id="view-info">
        <header class="view-header">
            <div>
                <h1 data-i18n="ui.info.title"></h1>
                <p class="subtitle" data-i18n="ui.info.subtitle"></p>
            </div>
        </header>
        <div class="card prose">
            <h2 data-i18n="ui.info.concept"></h2>
            <p><strong data-i18n="ui.info.c1.title"></strong> <span data-i18n="ui.info.c1.text"></span></p>
            <p><strong data-i18n="ui.info.c2.title"></strong> <span data-i18n="ui.info.c2.text"></span></p>
            <p><strong data-i18n="ui.info.c3.title"></strong> <span data-i18n="ui.info.c3.text"></span></p>
            <p><strong data-i18n="ui.info.c4.title"></strong> <span data-i18n="ui.info.c4.text"></span></p>
            <p><strong data-i18n="ui.info.c5.title"></strong> <span data-i18n="ui.info.c5.text"></span></p>
        </div>
        <div class="card" id="update-card">
            <div class="card-head"><h2 data-i18n="ui.upd.title"></h2></div>
            <div class="update-row">
                <span class="update-status" id="update-status"></span>
                <span class="spacer"></span>
                <button class="btn" id="update-check" data-i18n="ui.upd.check"></button>
                <button class="btn btn-primary" id="update-install" hidden></button>
            </div>
            <div class="progress" id="update-progress" hidden><div class="progress-fill" id="update-progress-fill"></div></div>
            <p class="hint" id="update-hint"></p>
        </div>
        <div class="card">
            <div class="card-head"><h2 data-i18n="ui.info.paths"></h2></div>
            <dl class="kv" id="info-kv"></dl>
        </div>
    </section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="dialog" id="confirm-dialog">
    <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div class="row-end">
            <button class="btn btn-ghost" value="cancel" data-i18n="ui.cancel"></button>
            <button class="btn btn-danger" value="ok" id="confirm-ok"></button>
        </div>
    </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
